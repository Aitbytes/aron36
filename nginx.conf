# Aron 36 — configuration nginx (image de production).
#
# Application statique, sans backend : aucun proxy, aucune variable
# d'environnement, aucune route dynamique. Le fichier est copié dans
# /etc/nginx/conf.d/default.conf par le Dockerfile.
#
# Note nginx : `add_header` n'est **pas** hérité dès qu'un bloc enfant déclare un
# `add_header`. Les en-têtes de sécurité sont donc répétés dans chaque `location`
# qui pose une politique de cache — c'est volontaire, la répétition est le prix
# de l'héritage partiel.

# ── Compression ────────────────────────────────────────────────────────────────
# Les assets textuels sont déjà minifiés ; la compression ramène le bundle à
# ~135 kB gzip. Les PNG ne sont pas concernés (déjà compressés).
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
  text/plain
  text/css
  text/javascript
  application/javascript
  application/json
  application/manifest+json
  image/svg+xml
  font/woff2;

server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ── Assets hachés par Vite : cache immuable un an ────────────────────────────
  # Le nom contient l'empreinte du contenu : une nouvelle version produit une
  # nouvelle URL. Aucune revalidation n'est nécessaire.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }

  # ── Service worker : cache nul ───────────────────────────────────────────────
  # Un `sw.js` servi depuis le cache HTTP gèlerait les mises à jour : le
  # navigateur ne verrait jamais le nouveau worker. Portée = racine du site.
  location = /sw.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }

  # ── Coque HTML : cache nul ───────────────────────────────────────────────────
  # `index.html` référence des assets hachés : le garder en cache figerait la
  # version de l'application. `no-cache` = revalidation, pas d'interdiction de
  # stockage (le service worker garde sa propre copie pour le hors-ligne).
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }

  # ── Manifeste et icônes : cache court ────────────────────────────────────────
  # Modifiés rarement, mais non hachés : une heure de cache évite de revalider à
  # chaque visite sans risquer de bloquer une mise à jour.
  location /icons/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }

  location = /manifest.webmanifest {
    # `mime.types` de nginx ne connaît pas `.webmanifest` : sans cette table, le
    # fichier sort en `application/octet-stream` et Chrome refuse le manifeste.
    # Un bloc `types` remplace la table héritée, mais cette `location` ne sert que
    # ce fichier — le remplacement est donc sans effet de bord.
    types {
      application/manifest+json webmanifest;
    }
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }

  # ── Repli SPA ────────────────────────────────────────────────────────────────
  # L'application n'a pas de routeur à chemin réel (navigation par état), mais le
  # repli garde une URL profonde ouverte à la main fonctionnelle, et sert la
  # coque pour tout chemin inconnu. La redirection interne vers /index.html passe
  # par le bloc `= /index.html` ci-dessus : la politique `no-cache` s'applique.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }

  # ── Améliorations futures (non activées volontairement) ──────────────────────
  # CSP stricte (`default-src 'self'`) : les styles sont injectés par Vite en
  # `<style>` en développement et React n'utilise aucun `eval`, mais une CSP non
  # testée casse silencieusement l'application sur les navigateurs anciens.
  # À traiter avec des tests de bout en bout, pas à l'aveugle.
  # `Permissions-Policy`, `Cross-Origin-Opener-Policy` et HSTS (une fois le HTTPS
  # terminé au niveau du reverse proxy Dokploy) relèvent de la même démarche.
}
