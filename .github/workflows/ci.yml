name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Traçabilité
        run: npm run traceability:check

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # Le build précède les tests : les tests du service worker lisent le VRAI
      # `dist/`. Placés après, ils étaient silencieusement ignorés en CI (pas de
      # `dist/`), et le précache n'était donc jamais vérifié sur un vrai build.
      - name: Build
        run: npm run build

      - name: Test
        run: npm run test
