<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  width="512"
  height="512"
  role="img"
  aria-label="Aron 36"
>
  <!--
    Variante « maskable » : fond plein cadre (le système applique son propre
    masque) et marque réduite à 85 % puis recentrée, pour que sa diagonale tienne
