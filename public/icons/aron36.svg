<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  width="512"
  height="512"
  role="img"
  aria-label="Aron 36"
>
  <!--
    Marque Aron 36 : « 36 » géométrique en deux traits des tokens
    (`--color-accent` puis `--color-accent-alt`). Construit en arcs à bouts
    arrondis : lisible dès 48 px, aucune police requise, donc identique sur
    toutes les machines. Fond `--color-bg-elevated`, coins arrondis (`any`).
  -->
  <rect width="64" height="64" rx="12" ry="12" fill="#161527" />
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <path d="M20.5 14 A9 9 0 0 1 20.5 32 A9 9 0 0 1 20.5 50" stroke="#ff5e8a" />
    <path d="M44.5 32 A9 9 0 1 1 44.5 50 A9 9 0 1 1 44.5 32" stroke="#a06bff" />
    <path d="M52.5 17 A13 13 0 0 0 39.5 32" stroke="#a06bff" />
  </g>
</svg>
